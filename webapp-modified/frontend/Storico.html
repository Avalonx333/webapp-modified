<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico dei tuoi viaggi</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/12df662af6.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body id="viaggi">
<img src="./img/TripMood.png" id="logo">
<nav id="cs-nav">
    <a href="index.html">Home</a>
    <a href="viaggi.html">← I Viaggi</a>
</nav>

<main id="viaggi-main">
    <h1 id="viaggi-title"><i class="fa-solid fa-clock-rotate-left"></i> Storico dei viaggi</h1>

    <div id="viaggi-grid">
        <div class="viaggi-row">
            <div class="subpage-card wide-card">
                <div class="subpage-card-icon"><i class="fa-solid fa-filter"></i></div>
                <h2 class="subpage-card-title">Filtra per anno</h2>
                <div class="filtro-anni" id="filtro-anni">
                    <button class="filtro-btn active" onclick="filtraAnno('tutti', this)">Tutti</button>
                </div>
            </div>
            <div class="subpage-card wide-card">
                <div class="subpage-card-icon"><i class="fa-solid fa-chart-simple"></i></div>
                <h2 class="subpage-card-title">Riepilogo</h2>
                <div class="stats-row">
                    <div class="stat-item"><span class="stat-num" id="stat-totale">0</span><span
                            class="stat-desc">Viaggi totali</span></div>
                    <div class="stat-item"><span class="stat-num" id="stat-paesi">0</span><span class="stat-desc">Paesi
                                visitati</span></div>
                    <div class="stat-item"><span class="stat-num" id="stat-giorni">0</span><span class="stat-desc">Giorni in
                                viaggio</span></div>
                </div>
            </div>
        </div>

        <div class="viaggi-row">
            <div id="storico-lista" class="viaggi-row">
                <!-- riempito da JS -->
            </div>
        </div>

        <div class="viaggi-row">
            <div class="subpage-card wide-card">
                <div class="subpage-card-icon"><i class="fa-solid fa-map-location-dot"></i></div>
                <h2 class="subpage-card-title">Mappa dei tuoi viaggi</h2>
                <div id="map-storico" style="width:100%; height:400px; border-radius:20px; border:2px solid #353535;"></div>
            </div>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>

</html>
