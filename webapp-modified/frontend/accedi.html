<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>accedi</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/12df662af6.js" crossorigin="anonymous"></script>
</head>

<body id="accedi">
<img src="./img/TripMood.png" id="logo">

<nav id="cs-nav">
    <a href="index.html">Home</a>
</nav>

<div class="card">
    <div class="header">
        <h1>Accedi</h1>
    </div>
    <p class="subtitle">Inserisci le tue credenziali per continuare</p>

    <div class="fields">

        <div class="field">
            <label for="email">Indirizzo Email</label>
            <input type="email" id="email" placeholder="esempio@gmail.com" />
        </div>

        <div class="field">
            <label for="pwd">Password</label>
            <div class="input-wrap">
                <input type="password" id="pwd" placeholder="••••••••" />
                <button class="toggle-btn" type="button"></button>
            </div>
        </div>

        <p class="login-link">Non hai un account? <a href="Registrati.html">Registrati</a></p>

        <button class="btn-submit" id="btn-accedi" type="button">Accedi</button>
    </div>
</div>
<script src="script.js"></script>
</body>

</html>
