<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recensioni</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/12df662af6.js" crossorigin="anonymous"></script>
</head>

<body id="viaggi">

<img src="./img/TripMood.png" id="logo">

<nav id="cs-nav">
    <a href="index.html">Home</a>
</nav>

<main id="viaggi-main">

    <h1 id="viaggi-title"><i class="fa-solid fa-star"></i> Recensioni</h1>

    <div id="viaggi-grid">

        <!-- FORM RECENSIONE -->
        <div class="viaggi-row">
            <div class="subpage-card wide-card">
                <div class="subpage-card-icon"><i class="fa-solid fa-pen"></i></div>
                <h2 class="subpage-card-title">Lascia una recensione</h2>

                <input type="text" id="rec-destinazione" class="subpage-input"
                       placeholder="Destinazione del viaggio">

                <textarea id="rec-testo" class="rec-textarea"
                          placeholder="Scrivi qui la tua recensione..."></textarea>

                <div style="margin-top:10px; text-align:center;">
                    <label style="font-size:14px; font-weight:bold;">Valutazione:</label>
                    <br>
                    <label><input type="radio" name="rec-stelle" value="1"> ★</label>
                    <label><input type="radio" name="rec-stelle" value="2"> ★★</label>
                    <label><input type="radio" name="rec-stelle" value="3" checked> ★★★</label>
                    <label><input type="radio" name="rec-stelle" value="4"> ★★★★</label>
                    <label><input type="radio" name="rec-stelle" value="5"> ★★★★★</label>
                </div>

                <button class="btn-submit" id="btn-invia-recensione" style="margin-top:15px;">
                    <i class="fa-solid fa-paper-plane"></i> Invia recensione
                </button>
            </div>
        </div>

        <!-- LISTA RECENSIONI -->
        <div class="viaggi-row">
            <div class="subpage-card wide-card">
                <div class="subpage-card-icon"><i class="fa-solid fa-comments"></i></div>
                <h2 class="subpage-card-title">Ultime recensioni</h2>

                <div id="rec-list" style="width:100%; display:flex; flex-wrap:wrap; gap:20px; justify-content:center;">

                </div>
            </div>
        </div>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
